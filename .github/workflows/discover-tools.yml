name: Discover yt-dlp tools

on:
  workflow_dispatch: # 手动触发：需要时在 Actions 页面点 Run workflow

permissions:
  contents: write

concurrency:
  group: discover-tools
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      # v7 起改用 Node 24 运行时，与 runner 保持一致（旧版 v4/v5 只支持 Node 20，会被强制升级并刷弃用警告）
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: 搜索候选工具
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: python3 discover-tools.py

      - name: 提交候选清单
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add candidates/
          if git diff --cached --quiet; then
            echo "无候选变更，跳过提交"
            exit 0
          fi
          git commit -m "docs: 候选工具清单 $(date +%F)"
          git pull --rebase origin main
          git push
