<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>装机小课堂｜认识软件安装包</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Ctext%20x%3D%225%22%20y%3D%221.5em%22%20font-size%3D%2245%22%3E%F0%9F%92%BB%F0%9F%93%B1%3C%2Ftext%3E%3C%2Fsvg%3E">
<style>
  :root {
    --bg: #f6f1e7;
    --card: #ffffff;
    --ink: #2b2b2b;
    --muted: #7a7265;
    --border: #2b2b2b;
    --shadow: 5px 5px 0 rgba(43,43,43,.14);
    --blue: #4a7dff;
    --blue-soft: #e3ecff;
    --orange: #ff9f43;
    --orange-soft: #fff0dd;
    --red: #ff6b6b;
    --red-soft: #ffe4e4;
    --green: #2ecc71;
    --green-soft: #e2f9ec;
    --yellow: #ffd93d;
    --radius: 22px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { min-height: 100%; }
  html { touch-action: manipulation; }
  body {
    font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--ink);
    font-size: 18px;
    line-height: 1.6;
    padding: calc(12px + var(--safe-area-inset-top, env(safe-area-inset-top, 0px))) 14px calc(20px + var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px)));
  }
  /* 容器顶部悬浮按钮（回退/分享）预留：容器内 52px + 安全区，浏览器版不受影响 */
  .in-container { padding-top: calc(52px + var(--safe-area-inset-top, env(safe-area-inset-top, 0px))); }
  #app { max-width: 560px; margin: 0 auto; }

  .screen { display: none; animation: pop .28s ease; }
  .screen.active { display: block; }
  @keyframes pop { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  /* ===== 通用卡片 ===== */
  .card {
    background: var(--card);
    border: 3px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 22px 20px;
    margin-bottom: 14px;
  }
  .btn {
    display: block;
    width: 100%;
    border: 3px solid var(--border);
    border-radius: 16px;
    background: var(--blue);
    color: #fff;
    font-size: 20px;
    font-weight: 700;
    padding: 15px 18px;
    cursor: pointer;
    box-shadow: 4px 4px 0 rgba(43,43,43,.16);
    transition: transform .08s, box-shadow .08s, background .15s;
    font-family: inherit;
  }
  .btn:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 rgba(43,43,43,.16); }
  .btn.orange { background: var(--orange); }
  .btn.green { background: var(--green); }
  .btn.gray { background: #9b9487; }
  .btn.small { font-size: 16px; padding: 10px 14px; width: auto; display: inline-block; }

  /* ===== 开始页 ===== */
  #screen-start { text-align: center; padding-top: 8vh; }
  .logo-big { font-size: 76px; line-height: 1.2; }
  .title-main { font-size: 36px; font-weight: 800; letter-spacing: 2px; margin-top: 6px; }
  .title-sub { color: var(--muted); font-size: 17px; margin: 10px 0 26px; }
  .tag-row { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin-bottom: 28px; }
  .tag {
    background: var(--card);
    border: 2.5px solid var(--border);
    border-radius: 999px;
    padding: 6px 14px;
    font-size: 15px;
    font-weight: 600;
    box-shadow: 3px 3px 0 rgba(43,43,43,.12);
  }
  .sound-toggle {
    margin-top: 26px;
    background: none;
    border: none;
    color: var(--muted);
    font-size: 15px;
    cursor: pointer;
    font-family: inherit;
    padding: 8px;
  }

  /* ===== 关卡地图 ===== */
  .map-head { text-align: center; margin: 10px 0 18px; }
  .map-head h2 { font-size: 28px; font-weight: 800; }
  .map-head p { color: var(--muted); font-size: 15px; }
  .level-card {
    background: var(--card);
    border: 3px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 18px 18px 16px;
    margin-bottom: 16px;
    cursor: pointer;
    transition: transform .1s;
    position: relative;
  }
  .level-card:active { transform: scale(.985); }
  .level-card.locked { cursor: default; opacity: .62; filter: grayscale(.5); }
  .level-row { display: flex; align-items: center; gap: 14px; }
  .level-emoji {
    font-size: 44px;
    width: 64px; height: 64px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 16px;
    border: 3px solid var(--border);
    flex-shrink: 0;
  }
  .level-info { flex: 1; min-width: 0; }
  .level-name { font-size: 22px; font-weight: 800; }
  .level-desc { font-size: 14.5px; color: var(--muted); line-height: 1.45; margin-top: 2px; }
  .level-meta { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; }
  .stars { font-size: 24px; letter-spacing: 2px; color: #d8d2c4; }
  .stars .on { color: var(--yellow); }
  .badge-got { font-size: 15px; font-weight: 700; color: var(--muted); }
  .lock-badge { position: absolute; right: 14px; top: 14px; font-size: 22px; }
  .home-btn { margin-top: 6px; }

  /* ===== 游戏中 ===== */
  .game-top {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 12px;
  }
  .lives { font-size: 26px; letter-spacing: 2px; }
  .lives .dead { opacity: .22; filter: grayscale(1); }
  .combo-pill {
    background: var(--card);
    border: 2.5px solid var(--border);
    border-radius: 999px;
    padding: 4px 12px;
    font-weight: 800;
    font-size: 15px;
    box-shadow: 3px 3px 0 rgba(43,43,43,.12);
    visibility: hidden;
  }
  .combo-pill.on { visibility: visible; }
  .progress-wrap {
    background: #e7dfcf;
    border: 3px solid var(--border);
    border-radius: 999px;
    height: 22px;
    margin-bottom: 14px;
    overflow: hidden;
    position: relative;
  }
  .progress-fill {
    height: 100%;
    border-radius: 999px;
    transition: width .3s ease;
  }
  .progress-text {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 12.5px; font-weight: 800; color: var(--ink);
  }
  .q-card .q-scene { font-size: 15.5px; color: var(--muted); margin-bottom: 6px; }
  .q-card .q-text { font-size: 20px; font-weight: 700; line-height: 1.5; }
  .q-num { font-size: 14px; font-weight: 800; color: var(--muted); margin-bottom: 8px; }
  .opts { margin-top: 16px; display: flex; flex-direction: column; gap: 12px; }
  .opt {
    display: flex; align-items: center; gap: 12px;
    width: 100%; text-align: left;
    background: var(--card);
    border: 3px solid var(--border);
    border-radius: 16px;
    padding: 14px 16px;
    font-size: 17.5px;
    font-family: inherit; color: var(--ink);
    cursor: pointer;
    box-shadow: 3px 3px 0 rgba(43,43,43,.12);
    transition: transform .08s, box-shadow .08s, background .15s, color .15s;
  }
  .opt:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 rgba(43,43,43,.12); }
  .opt.disabled { pointer-events: none; }
  .opt .opt-key {
    width: 30px; height: 30px; flex-shrink: 0;
    border: 2.5px solid var(--border);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 16px; background: #f3ede0;
  }
  .opt.correct { background: var(--green); color: #fff; border-color: var(--border); }
  .opt.correct .opt-key { background: #fff; }
  .opt.wrong { background: var(--red); color: #fff; }
  .opt.wrong .opt-key { background: #fff; }
  .opt.dim { opacity: .45; }

  .explain-card {
    margin-top: 14px;
    background: #fff8e1;
    border: 3px solid var(--border);
    border-radius: 16px;
    padding: 14px 16px;
    box-shadow: 3px 3px 0 rgba(43,43,43,.12);
  }
  .explain-card .exp-title { font-weight: 800; font-size: 16px; margin-bottom: 4px; }
  .explain-card .exp-body { font-size: 15.5px; line-height: 1.65; }
  .explain-card .exp-body b { font-weight: 800; }

  /* ===== 结算 ===== */
  .result-head { text-align: center; padding: 12px 0 4px; }
  .result-emoji { font-size: 70px; }
  .result-stars { font-size: 52px; letter-spacing: 6px; margin: 6px 0 2px; }
  .result-stars .star { display: inline-block; color: #d8d2c4; }
  .result-stars .star.on { color: var(--yellow); animation: starPop .45s ease backwards; }
  .result-stars .star.off { opacity: .28; }
  @keyframes starPop { 0% { transform: scale(0) rotate(-30deg); } 70% { transform: scale(1.35) rotate(8deg); } 100% { transform: scale(1) rotate(0); } }
  .badge-award {
    margin: 16px auto;
    width: fit-content;
    background: var(--yellow);
    border: 3px solid var(--border);
    border-radius: 18px;
    padding: 10px 22px;
    font-size: 20px; font-weight: 800;
    box-shadow: var(--shadow);
  }
  .score-line { text-align: center; font-size: 17px; color: var(--muted); margin-bottom: 4px; }
  .score-line b { color: var(--ink); font-size: 22px; }
  .new-record { text-align: center; color: var(--green); font-weight: 800; font-size: 16px; margin-bottom: 4px; }
  .result-btns { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }

  /* ===== 失败弹层 ===== */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(43,43,43,.55);
    display: none; align-items: center; justify-content: center;
    padding: 24px;
    z-index: 50;
  }
  .overlay.show { display: flex; }
  .overlay-card {
    background: var(--card);
    border: 3px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 26px 22px;
    text-align: center;
    max-width: 400px; width: 100%;
    animation: pop .25s ease;
  }
  .overlay-card .ov-emoji { font-size: 60px; }
  .overlay-card h3 { font-size: 24px; margin: 8px 0 6px; }
  .overlay-card p { color: var(--muted); font-size: 15.5px; margin-bottom: 18px; }

  /* ===== 毕业页 ===== */
  #screen-final { text-align: center; padding-top: 6vh; }
  .grad-emoji { font-size: 84px; }
  .grad-title { font-size: 32px; font-weight: 800; margin: 8px 0 2px; }
  .grad-title2 { font-size: 20px; color: var(--muted); margin-bottom: 16px; }
  .grad-badges { display: flex; justify-content: center; gap: 12px; margin: 14px 0; }
  .grad-badge {
    background: var(--card);
    border: 3px solid var(--border);
    border-radius: 18px;
    padding: 10px 12px;
    font-size: 13.5px; font-weight: 700;
    box-shadow: 3px 3px 0 rgba(43,43,43,.12);
  }
  .grad-badge .gb-emoji { font-size: 30px; display: block; margin-bottom: 2px; }
  .grad-score { font-size: 18px; margin: 10px 0 2px; }
  .grad-score b { font-size: 30px; }
  .grad-rank {
    display: inline-block;
    background: var(--yellow);
    border: 3px solid var(--border);
    border-radius: 999px;
    padding: 8px 20px;
    font-size: 20px; font-weight: 800;
    margin: 8px 0 22px;
    box-shadow: 3px 3px 0 rgba(43,43,43,.12);
  }
  .tip-line { font-size: 14.5px; color: var(--muted); margin-top: 18px; }

  .back-link {
    display: block; text-align: center;
    margin-top: 16px;
    color: var(--muted); font-size: 15px;
    background: none; border: none; cursor: pointer;
    font-family: inherit; text-decoration: underline;
  }

  /* ===== 提示条 ===== */
  #toast {
    position: fixed; left: 50%; bottom: 40px;
    transform: translateX(-50%);
    background: rgba(43,43,43,.93);
    color: #fff;
    padding: 13px 22px;
    border-radius: 14px;
    font-size: 15px;
    z-index: 99;
    opacity: 0;
    pointer-events: none;
    transition: opacity .3s;
    max-width: 92%;
    text-align: center;
    line-height: 1.5;
  }
  #toast.show { opacity: 1; }
</style>
</head>
<body>
<div id="app">

  <!-- ========== 开始页 ========== -->
  <section id="screen-start" class="screen active">
    <div class="logo-big">💻📱</div>
    <div class="title-main">装机小课堂</div>
    <div class="title-sub">认识软件安装包 · 再也不怕装错软件</div>
    <div class="tag-row">
      <span class="tag">📦 认格式</span>
      <span class="tag">🏪 找对门</span>
      <span class="tag">🛡️ 防骗卫士</span>
    </div>
    <button class="btn" id="btn-start">开始闯关 ▶</button>
    <button class="sound-toggle" id="btn-sound">🔊 音效：开</button>
    <div class="tip-line">三关闯关 · 每题都有讲解</div>
  </section>

  <!-- ========== 关卡地图 ========== -->
  <section id="screen-map" class="screen">
    <div class="map-head">
      <h2>🗺️ 选择关卡</h2>
      <p>三关闯完，你就是装机小能手</p>
    </div>
    <div id="level-list"></div>
    <button class="btn gray home-btn" id="btn-home">🏠 回到首页</button>
  </section>

  <!-- ========== 游戏中 ========== -->
  <section id="screen-game" class="screen">
    <div class="game-top">
      <span class="lives" id="lives"></span>
      <span class="combo-pill" id="combo-pill">🔥 x2</span>
    </div>
    <div class="progress-wrap">
      <div class="progress-fill" id="progress-fill"></div>
      <div class="progress-text" id="progress-text"></div>
    </div>
    <div class="card q-card">
      <div class="q-num" id="q-num"></div>
      <div class="q-scene" id="q-scene"></div>
      <div class="q-text" id="q-text"></div>
      <div class="opts" id="opts"></div>
      <div class="explain-card" id="explain" style="display:none;">
        <div class="exp-title">💡 为什么？</div>
        <div class="exp-body" id="explain-body"></div>
      </div>
      <button class="btn next-btn" id="btn-next" style="display:none; margin-top:14px;">下一题 ▶</button>
    </div>
  </section>

  <!-- ========== 关卡结算 ========== -->
  <section id="screen-result" class="screen">
    <div class="result-head">
      <div class="result-emoji" id="result-emoji"></div>
      <div class="result-stars" id="result-stars"></div>
    </div>
    <div class="badge-award" id="badge-award"></div>
    <div class="score-line">本关得分 <b id="result-score"></b></div>
    <div class="new-record" id="result-record"></div>
    <div class="result-btns">
      <button class="btn" id="btn-next-level">下一关 ▶</button>
      <button class="btn orange" id="btn-retry-level">🔄 再玩一次</button>
      <button class="btn gray" id="btn-to-map">🗺️ 返回关卡地图</button>
    </div>
  </section>

  <!-- ========== 毕业页 ========== -->
  <section id="screen-final" class="screen">
    <div class="grad-emoji">🎓</div>
    <div class="grad-title">恭喜毕业！</div>
    <div class="grad-title2">三关全部通过</div>
    <div class="grad-badges" id="grad-badges"></div>
    <div class="grad-score">总得分 <b id="grad-score"></b></div>
    <div class="grad-rank" id="grad-rank"></div>
    <button class="btn" id="btn-replay-all">🔄 全部重玩</button>
    <button class="btn green" id="btn-share" style="margin-top:10px;">📸 保存成绩单</button>
    <button class="btn orange" id="btn-final-map" style="margin-top:10px;">🗺️ 返回关卡地图</button>
    <button class="back-link" id="btn-final-home">回到首页</button>
  </section>

  <!-- ========== 失败弹层 ========== -->
  <div class="overlay" id="overlay-fail">
    <div class="overlay-card">
      <div class="ov-emoji">💔</div>
      <h3>心碎了</h3>
      <p>这一关要重新开始啦。<br>别灰心，再看看讲解，你一定行！</p>
      <button class="btn" id="btn-fail-retry">🔄 再来一次</button>
    </div>
  </div>

    <!-- ========== 成绩单预览（浏览器环境） ========== -->
  <div class="overlay" id="overlay-preview">
    <div class="overlay-card" style="max-width:480px;">
      <img id="preview-img" alt="成绩单" style="width:100%; border:3px solid #2b2b2b; border-radius:14px; display:block;">
      <p style="margin:12px 0 4px; font-size:15px; color:#7a7265;">长按图片或右键可保存 📸</p>
      <button class="btn" id="btn-preview-close" style="margin-top:10px;">关闭</button>
    </div>
  </div>
  <div id="toast"></div>

</div>



  <script src="./app.js"></script>
</body>
</html>
