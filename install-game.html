<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>装机小课堂｜认识软件安装包</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Ctext%20x%3D%225%22%20y%3D%221.5em%22%20font-size%3D%2245%22%3E%F0%9F%92%BB%F0%9F%93%B1%3C%2Ftext%3E%3C%2Fsvg%3E">
<style>
  :root {
    --bg: #f6f1e7;
    --card: #ffffff;
    --ink: #2b2b2b;
    --muted: #7a7265;
    --border: #2b2b2b;
    --shadow: 5px 5px 0 rgba(43,43,43,.14);
    --blue: #4a7dff;
    --blue-soft: #e3ecff;
    --orange: #ff9f43;
    --orange-soft: #fff0dd;
    --red: #ff6b6b;
    --red-soft: #ffe4e4;
    --green: #2ecc71;
    --green-soft: #e2f9ec;
    --yellow: #ffd93d;
    --radius: 22px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { min-height: 100%; }
  body {
    font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--ink);
    font-size: 18px;
    line-height: 1.6;
    padding: calc(12px + env(safe-area-inset-top, 0px)) 14px calc(20px + env(safe-area-inset-bottom, 0px));
  }
  #app { max-width: 560px; margin: 0 auto; }

  .screen { display: none; animation: pop .28s ease; }
  .screen.active { display: block; }
  @keyframes pop { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  /* ===== 通用卡片 ===== */
  .card {
    background: var(--card);
    border: 3px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 22px 20px;
    margin-bottom: 14px;
  }
  .btn {
    display: block;
    width: 100%;
    border: 3px solid var(--border);
    border-radius: 16px;
    background: var(--blue);
    color: #fff;
    font-size: 20px;
    font-weight: 700;
    padding: 15px 18px;
    cursor: pointer;
    box-shadow: 4px 4px 0 rgba(43,43,43,.16);
    transition: transform .08s, box-shadow .08s, background .15s;
    font-family: inherit;
  }
  .btn:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 rgba(43,43,43,.16); }
  .btn.orange { background: var(--orange); }
  .btn.green { background: var(--green); }
  .btn.gray { background: #9b9487; }
  .btn.small { font-size: 16px; padding: 10px 14px; width: auto; display: inline-block; }

  /* ===== 开始页 ===== */
  #screen-start { text-align: center; padding-top: 8vh; }
  .logo-big { font-size: 76px; line-height: 1.2; }
  .title-main { font-size: 36px; font-weight: 800; letter-spacing: 2px; margin-top: 6px; }
  .title-sub { color: var(--muted); font-size: 17px; margin: 10px 0 26px; }
  .tag-row { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin-bottom: 28px; }
  .tag {
    background: var(--card);
    border: 2.5px solid var(--border);
    border-radius: 999px;
    padding: 6px 14px;
    font-size: 15px;
    font-weight: 600;
    box-shadow: 3px 3px 0 rgba(43,43,43,.12);
  }
  .sound-toggle {
    margin-top: 26px;
    background: none;
    border: none;
    color: var(--muted);
    font-size: 15px;
    cursor: pointer;
    font-family: inherit;
    padding: 8px;
  }

  /* ===== 关卡地图 ===== */
  .map-head { text-align: center; margin: 10px 0 18px; }
  .map-head h2 { font-size: 28px; font-weight: 800; }
  .map-head p { color: var(--muted); font-size: 15px; }
  .level-card {
    background: var(--card);
    border: 3px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 18px 18px 16px;
    margin-bottom: 16px;
    cursor: pointer;
    transition: transform .1s;
    position: relative;
  }
  .level-card:active { transform: scale(.985); }
  .level-card.locked { cursor: default; opacity: .62; filter: grayscale(.5); }
  .level-row { display: flex; align-items: center; gap: 14px; }
  .level-emoji {
    font-size: 44px;
    width: 64px; height: 64px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 16px;
    border: 3px solid var(--border);
    flex-shrink: 0;
  }
  .level-info { flex: 1; min-width: 0; }
  .level-name { font-size: 22px; font-weight: 800; }
  .level-desc { font-size: 14.5px; color: var(--muted); line-height: 1.45; margin-top: 2px; }
  .level-meta { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; }
  .stars { font-size: 24px; letter-spacing: 2px; color: #d8d2c4; }
  .stars .on { color: var(--yellow); }
  .badge-got { font-size: 15px; font-weight: 700; color: var(--muted); }
  .lock-badge { position: absolute; right: 14px; top: 14px; font-size: 22px; }
  .home-btn { margin-top: 6px; }

  /* ===== 游戏中 ===== */
  .game-top {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 12px;
  }
  .lives { font-size: 26px; letter-spacing: 2px; }
  .lives .dead { opacity: .22; filter: grayscale(1); }
  .combo-pill {
    background: var(--card);
    border: 2.5px solid var(--border);
    border-radius: 999px;
    padding: 4px 12px;
    font-weight: 800;
    font-size: 15px;
    box-shadow: 3px 3px 0 rgba(43,43,43,.12);
    visibility: hidden;
  }
  .combo-pill.on { visibility: visible; }
  .progress-wrap {
    background: #e7dfcf;
    border: 3px solid var(--border);
    border-radius: 999px;
    height: 22px;
    margin-bottom: 14px;
    overflow: hidden;
    position: relative;
  }
  .progress-fill {
    height: 100%;
    border-radius: 999px;
    transition: width .3s ease;
  }
  .progress-text {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 12.5px; font-weight: 800; color: var(--ink);
  }
  .q-card .q-scene { font-size: 15.5px; color: var(--muted); margin-bottom: 6px; }
  .q-card .q-text { font-size: 20px; font-weight: 700; line-height: 1.5; }
  .q-num { font-size: 14px; font-weight: 800; color: var(--muted); margin-bottom: 8px; }
  .opts { margin-top: 16px; display: flex; flex-direction: column; gap: 12px; }
  .opt {
    display: flex; align-items: center; gap: 12px;
    width: 100%; text-align: left;
    background: var(--card);
    border: 3px solid var(--border);
    border-radius: 16px;
    padding: 14px 16px;
    font-size: 17.5px;
    font-family: inherit; color: var(--ink);
    cursor: pointer;
    box-shadow: 3px 3px 0 rgba(43,43,43,.12);
    transition: transform .08s, box-shadow .08s, background .15s, color .15s;
  }
  .opt:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 rgba(43,43,43,.12); }
  .opt.disabled { pointer-events: none; }
  .opt .opt-key {
    width: 30px; height: 30px; flex-shrink: 0;
    border: 2.5px solid var(--border);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 16px; background: #f3ede0;
  }
  .opt.correct { background: var(--green); color: #fff; border-color: var(--border); }
  .opt.correct .opt-key { background: #fff; }
  .opt.wrong { background: var(--red); color: #fff; }
  .opt.wrong .opt-key { background: #fff; }
  .opt.dim { opacity: .45; }

  .explain-card {
    margin-top: 14px;
    background: #fff8e1;
    border: 3px solid var(--border);
    border-radius: 16px;
    padding: 14px 16px;
    box-shadow: 3px 3px 0 rgba(43,43,43,.12);
  }
  .explain-card .exp-title { font-weight: 800; font-size: 16px; margin-bottom: 4px; }
  .explain-card .exp-body { font-size: 15.5px; line-height: 1.65; }
  .explain-card .exp-body b { font-weight: 800; }

  /* ===== 结算 ===== */
  .result-head { text-align: center; padding: 12px 0 4px; }
  .result-emoji { font-size: 70px; }
  .result-stars { font-size: 52px; letter-spacing: 6px; margin: 6px 0 2px; }
  .result-stars .star { display: inline-block; color: #d8d2c4; }
  .result-stars .star.on { color: var(--yellow); animation: starPop .45s ease backwards; }
  .result-stars .star.off { opacity: .28; }
  @keyframes starPop { 0% { transform: scale(0) rotate(-30deg); } 70% { transform: scale(1.35) rotate(8deg); } 100% { transform: scale(1) rotate(0); } }
  .badge-award {
    margin: 16px auto;
    width: fit-content;
    background: var(--yellow);
    border: 3px solid var(--border);
    border-radius: 18px;
    padding: 10px 22px;
    font-size: 20px; font-weight: 800;
    box-shadow: var(--shadow);
  }
  .score-line { text-align: center; font-size: 17px; color: var(--muted); margin-bottom: 4px; }
  .score-line b { color: var(--ink); font-size: 22px; }
  .new-record { text-align: center; color: var(--green); font-weight: 800; font-size: 16px; margin-bottom: 4px; }
  .result-btns { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }

  /* ===== 失败弹层 ===== */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(43,43,43,.55);
    display: none; align-items: center; justify-content: center;
    padding: 24px;
    z-index: 50;
  }
  .overlay.show { display: flex; }
  .overlay-card {
    background: var(--card);
    border: 3px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 26px 22px;
    text-align: center;
    max-width: 400px; width: 100%;
    animation: pop .25s ease;
  }
  .overlay-card .ov-emoji { font-size: 60px; }
  .overlay-card h3 { font-size: 24px; margin: 8px 0 6px; }
  .overlay-card p { color: var(--muted); font-size: 15.5px; margin-bottom: 18px; }

  /* ===== 毕业页 ===== */
  #screen-final { text-align: center; padding-top: 6vh; }
  .grad-emoji { font-size: 84px; }
  .grad-title { font-size: 32px; font-weight: 800; margin: 8px 0 2px; }
  .grad-title2 { font-size: 20px; color: var(--muted); margin-bottom: 16px; }
  .grad-badges { display: flex; justify-content: center; gap: 12px; margin: 14px 0; }
  .grad-badge {
    background: var(--card);
    border: 3px solid var(--border);
    border-radius: 18px;
    padding: 10px 12px;
    font-size: 13.5px; font-weight: 700;
    box-shadow: 3px 3px 0 rgba(43,43,43,.12);
  }
  .grad-badge .gb-emoji { font-size: 30px; display: block; margin-bottom: 2px; }
  .grad-score { font-size: 18px; margin: 10px 0 2px; }
  .grad-score b { font-size: 30px; }
  .grad-rank {
    display: inline-block;
    background: var(--yellow);
    border: 3px solid var(--border);
    border-radius: 999px;
    padding: 8px 20px;
    font-size: 20px; font-weight: 800;
    margin: 8px 0 22px;
    box-shadow: 3px 3px 0 rgba(43,43,43,.12);
  }
  .tip-line { font-size: 14.5px; color: var(--muted); margin-top: 18px; }

  .back-link {
    display: block; text-align: center;
    margin-top: 16px;
    color: var(--muted); font-size: 15px;
    background: none; border: none; cursor: pointer;
    font-family: inherit; text-decoration: underline;
  }

  /* ===== 提示条 ===== */
  #toast {
    position: fixed; left: 50%; bottom: 40px;
    transform: translateX(-50%);
    background: rgba(43,43,43,.93);
    color: #fff;
    padding: 13px 22px;
    border-radius: 14px;
    font-size: 15px;
    z-index: 99;
    opacity: 0;
    pointer-events: none;
    transition: opacity .3s;
    max-width: 92%;
    text-align: center;
    line-height: 1.5;
  }
  #toast.show { opacity: 1; }
</style>
</head>
<body>
<div id="app">

  <!-- ========== 开始页 ========== -->
  <section id="screen-start" class="screen active">
    <div class="logo-big">💻📱</div>
    <div class="title-main">装机小课堂</div>
    <div class="title-sub">认识软件安装包 · 再也不怕装错软件</div>
    <div class="tag-row">
      <span class="tag">📦 认格式</span>
      <span class="tag">🏪 找对门</span>
      <span class="tag">🛡️ 防骗卫士</span>
    </div>
    <button class="btn" id="btn-start">开始闯关 ▶</button>
    <button class="sound-toggle" id="btn-sound">🔊 音效：开</button>
    <div class="tip-line">三关闯关 · 每题都有讲解</div>
  </section>

  <!-- ========== 关卡地图 ========== -->
  <section id="screen-map" class="screen">
    <div class="map-head">
      <h2>🗺️ 选择关卡</h2>
      <p>三关闯完，你就是装机小能手</p>
    </div>
    <div id="level-list"></div>
    <button class="btn gray home-btn" id="btn-home">🏠 回到首页</button>
  </section>

  <!-- ========== 游戏中 ========== -->
  <section id="screen-game" class="screen">
    <div class="game-top">
      <span class="lives" id="lives"></span>
      <span class="combo-pill" id="combo-pill">🔥 x2</span>
    </div>
    <div class="progress-wrap">
      <div class="progress-fill" id="progress-fill"></div>
      <div class="progress-text" id="progress-text"></div>
    </div>
    <div class="card q-card">
      <div class="q-num" id="q-num"></div>
      <div class="q-scene" id="q-scene"></div>
      <div class="q-text" id="q-text"></div>
      <div class="opts" id="opts"></div>
      <div class="explain-card" id="explain" style="display:none;">
        <div class="exp-title">💡 为什么？</div>
        <div class="exp-body" id="explain-body"></div>
      </div>
      <button class="btn next-btn" id="btn-next" style="display:none; margin-top:14px;">下一题 ▶</button>
    </div>
  </section>

  <!-- ========== 关卡结算 ========== -->
  <section id="screen-result" class="screen">
    <div class="result-head">
      <div class="result-emoji" id="result-emoji"></div>
      <div class="result-stars" id="result-stars"></div>
    </div>
    <div class="badge-award" id="badge-award"></div>
    <div class="score-line">本关得分 <b id="result-score"></b></div>
    <div class="new-record" id="result-record"></div>
    <div class="result-btns">
      <button class="btn" id="btn-next-level">下一关 ▶</button>
      <button class="btn orange" id="btn-retry-level">🔄 再玩一次</button>
      <button class="btn gray" id="btn-to-map">🗺️ 返回关卡地图</button>
    </div>
  </section>

  <!-- ========== 毕业页 ========== -->
  <section id="screen-final" class="screen">
    <div class="grad-emoji">🎓</div>
    <div class="grad-title">恭喜毕业！</div>
    <div class="grad-title2">三关全部通过</div>
    <div class="grad-badges" id="grad-badges"></div>
    <div class="grad-score">总得分 <b id="grad-score"></b></div>
    <div class="grad-rank" id="grad-rank"></div>
    <button class="btn" id="btn-replay-all">🔄 全部重玩</button>
    <button class="btn green" id="btn-share" style="margin-top:10px;">📸 保存成绩单</button>
    <button class="btn orange" id="btn-final-map" style="margin-top:10px;">🗺️ 返回关卡地图</button>
    <button class="back-link" id="btn-final-home">回到首页</button>
  </section>

  <!-- ========== 失败弹层 ========== -->
  <div class="overlay" id="overlay-fail">
    <div class="overlay-card">
      <div class="ov-emoji">💔</div>
      <h3>心碎了</h3>
      <p>这一关要重新开始啦。<br>别灰心，再看看讲解，你一定行！</p>
      <button class="btn" id="btn-fail-retry">🔄 再来一次</button>
    </div>
  </div>

  <div id="toast"></div>

</div>

<script>
/* ================= 题库 ================= */
const LEVELS = [
  {
    id: 1,
    name: "认格式",
    emoji: "📦",
    color: "#4a7dff",
    soft: "#e3ecff",
    desc: "安装包长什么样？一眼认出它是哪个系统的",
    badge: "🏅 格式大师",
    questions: [
      {
        scene: "情境：同事发来一个文件，名字叫「最新微信.exe」，说\"帮你把微信装到手机上\"。",
        q: "你应该怎么做？",
        options: ["直接点开安装", "告诉他：.exe 是电脑的安装包，手机装不了", "先解压，再装到手机"],
        correct: 1,
        explain: "后缀 .exe 是 Windows 电脑的安装包格式，安卓手机认的是 <b>.apk</b>。要么同事发错了，要么……这是个骗局，千万别点开。"
      },
      {
        scene: "",
        q: "文件「微信_8.0.apk」是哪个系统的安装包？",
        options: ["安卓 Android", "苹果 iOS", "Windows 电脑"],
        correct: 0,
        explain: "<b>.apk 是安卓系统的安装包格式</b>。苹果手机用的是 .ipa，Windows 电脑用的是 .exe。"
      },
      {
        scene: "情境：朋友说：\"我把 QQ 安装包发你，是个 .dmg 文件。\"",
        q: "这个文件是给谁用的？",
        options: ["安卓手机", "苹果电脑 Mac", "Windows 电脑"],
        correct: 1,
        explain: "<b>.dmg 是苹果电脑（macOS）的安装包格式</b>，相当于 Windows 的 .exe。双击 .dmg 会打开一个\"磁盘映像\"，再把里面的软件拖进\"应用程序\"文件夹。"
      },
      {
        scene: "",
        q: "「office.msi」是哪个系统的安装包？",
        options: ["Windows", "安卓", "苹果电脑"],
        correct: 0,
        explain: "<b>.msi 是微软官方的安装格式</b>，和 .exe 一样属于 Windows 系统。很多办公软件、企业软件用 .msi 来统一安装。"
      },
      {
        scene: "",
        q: "苹果设备（iPhone、iPad）能直接安装 .apk 文件吗？",
        options: ["能，跟安卓一样", "不能，苹果手机只能通过 App Store 安装软件", "能，但要先越狱"],
        correct: 1,
        explain: "苹果手机的应用格式是 <b>.ipa</b>，而且苹果不允许用户自己装安装包，所有软件都要从 <b>App Store</b> 下载。这也是苹果手机\"装不了乱七八糟软件\"的原因。"
      },
      {
        scene: "",
        q: "在 Windows 电脑上双击一个 .dmg 文件，会发生什么？",
        options: ["正常安装软件", "打不开，因为 .dmg 是苹果电脑的格式", "电脑会中毒"],
        correct: 1,
        explain: "<b>.dmg 是苹果电脑专用的格式，Windows 不认识它</b>。反过来，把 .exe 发给苹果电脑也打不开。看到打不开的安装包，先想想是不是系统搞错了。"
      },
      {
        scene: "",
        q: "以下哪个是安卓应用的安装包格式？",
        options: [".dmg", ".exe", ".apk"],
        correct: 2,
        explain: "<b>.apk = 安卓</b>。记住最常见的三个：安卓 .apk、Windows .exe、苹果电脑 .dmg，就够用啦。"
      },
      {
        scene: "",
        q: "「.ipa」是什么？",
        options: ["苹果设备（iOS）的应用格式，普通人一般接触不到", "安卓的应用格式", "电脑病毒的格式"],
        correct: 0,
        explain: "<b>.ipa 是苹果 iOS 的应用格式</b>，但因为苹果只允许从 App Store 装软件，普通人几乎见不到 .ipa 文件。要是有人说\"发你个 .ipa 装上\"，反而要小心。"
      },
      {
        scene: "",
        q: "华为鸿蒙（HarmonyOS）手机的应用安装包格式是？",
        options: [".hap", ".exe", ".ipa"],
        correct: 0,
        explain: "鸿蒙手机的原生应用格式是 <b>.hap</b>（鸿蒙手机也兼容安装安卓的 .apk）。不管什么格式，都建议从手机自带的应用市场下载。"
      },
      {
        scene: "",
        q: "文件「全家福.jpg」是安装包吗？",
        options: ["是，能安装软件", "不是，.jpg 是图片文件", "是，但要改后缀名才能装"],
        correct: 1,
        explain: "<b>.jpg 是图片格式，不是安装包</b>。安装包格式就那么几种（.exe / .apk / .dmg / .msi / .ipa / .hap），其他后缀的文件都不是\"能安装的软件\"。"
      }
    ]
  },
  {
    id: 2,

/* ================= 常量 ================= */
const PER_LEVEL = 6;          // 每关题数
const BASE_SCORE = 100;       // 每题基础分
const MAX_COMBO = 3;          // 连击上限
const SAVE_KEY = "zhuangji-game-v1";

/* ================= 状态 ================= */
let state = {
  unlocked: 1,                // 已解锁到第几关
  best: {},                   // { levelId: { stars, score } }
  badges: [],                 // 已获得徽章 levelId 列表
  totalBest: 0
};
let run = null;               // 当前局：{ level, questions, idx, lives, combo, score, answered, stars }

/* ================= 工具 ================= */
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function save() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch (e) {}
}
function load() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (raw) {
      const s = JSON.parse(raw);
      if (s && typeof s === "object") Object.assign(state, s);
    }
  } catch (e) {}
}
function showScreen(id) {
  document.querySelectorAll(".screen").forEach(el => el.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  window.scrollTo(0, 0);
}

/* ================= 音效（Web Audio，无外部文件） ================= */
let audioCtx = null;
let soundOn = true;
try { soundOn = localStorage.getItem("zhuangji-sound") !== "off"; } catch (e) {}
function ensureAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  }
  if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
}
function beep(freq, dur, type, delay, vol) {
  if (!soundOn || !audioCtx) return;
  const t = audioCtx.currentTime + (delay || 0);
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type || "sine";
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(vol || 0.18, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(t);
  osc.stop(t + dur + 0.02);
}
const sfx = {
  click() { ensureAudio(); beep(660, 0.06, "square", 0, 0.06); },
  correct() { ensureAudio(); beep(523, 0.12, "sine", 0); beep(659, 0.12, "sine", 0.11); beep(784, 0.2, "sine", 0.22); },
  wrong() { ensureAudio(); beep(220, 0.22, "sawtooth", 0, 0.12); beep(165, 0.3, "sawtooth", 0.18, 0.12); },
  win() { ensureAudio(); [523, 659, 784, 1047].forEach((f, i) => beep(f, 0.22, "sine", i * 0.13)); },
  lose() { ensureAudio(); [392, 330, 262].forEach((f, i) => beep(f, 0.25, "triangle", i * 0.16, 0.14)); }
};
function updateSoundBtn() {
  document.getElementById("btn-sound").textContent = soundOn ? "🔊 音效：开" : "🔇 音效：关";
}

/* ================= 开始页 ================= */
document.getElementById("btn-start").addEventListener("click", () => {
  sfx.click();
  renderMap();
  showScreen("screen-map");
});
document.getElementById("btn-sound").addEventListener("click", () => {
  ensureAudio();
  soundOn = !soundOn;
  try { localStorage.setItem("zhuangji-sound", soundOn ? "on" : "off"); } catch (e) {}
  updateSoundBtn();
  if (soundOn) sfx.click();
});

/* ================= 关卡地图 ================= */
function starStr(levelId) {
  const b = state.best[levelId];
  const n = b ? b.stars : 0;
  return "★".repeat(n) + "☆".repeat(3 - n);
}
function renderMap() {
  const list = document.getElementById("level-list");
  list.innerHTML = "";
  LEVELS.forEach(lv => {
    const locked = lv.id > state.unlocked;
    const b = state.best[lv.id];
    const gotBadge = state.badges.includes(lv.id);
    const el = document.createElement("div");
    el.className = "level-card" + (locked ? " locked" : "");
    el.innerHTML = `
      <div class="level-row">
        <div class="level-emoji" style="background:${lv.soft};">${lv.emoji}</div>
        <div class="level-info">
          <div class="level-name">第 ${lv.id} 关 · ${lv.name}</div>
          <div class="level-desc">${lv.desc}</div>
        </div>
      </div>
      <div class="level-meta">
        <span class="stars"><span class="on">${starStr(lv.id).replace(/☆/g, "")}</span>${"☆".repeat(3 - (b ? b.stars : 0))}</span>
        <span class="badge-got">${gotBadge ? "🏅 已通关" : locked ? "🔒 先闯上一关" : "未通关"}</span>
      </div>
      ${locked ? '<span class="lock-badge">🔒</span>' : ""}
    `;
    if (!locked) {
      el.addEventListener("click", () => { sfx.click(); startLevel(lv.id); });
    }
    list.appendChild(el);
  });
}

/* ================= 游戏 ================= */
function startLevel(levelId) {
  const lv = LEVELS.find(l => l.id === levelId);
  run = {
    level: lv,
    questions: shuffle(lv.questions).slice(0, PER_LEVEL),
    idx: 0,
    lives: 3,
    combo: 1,
    score: 0,
    answered: false
  };
  showScreen("screen-game");
  renderQuestion();
}
function renderLives() {
  const el = document.getElementById("lives");
  el.innerHTML = "";
  for (let i = 0; i < 3; i++) {
    el.appendChild(document.createTextNode(run.lives > i ? "❤️" : "🤍"));
  }
}
function renderQuestion() {
  const q = run.questions[run.idx];
  run.answered = false;
  renderLives();
  // 连击
  const pill = document.getElementById("combo-pill");
  if (run.combo >= 2) {
    pill.textContent = "🔥 x" + run.combo;
    pill.classList.add("on");
  } else {
    pill.classList.remove("on");
  }
  // 进度
  const fill = document.getElementById("progress-fill");
  fill.style.background = run.level.color;
  fill.style.width = (run.idx / PER_LEVEL * 100) + "%";
  document.getElementById("progress-text").textContent = `第 ${run.idx + 1} / ${PER_LEVEL} 题`;
  // 题目
  document.getElementById("q-num").textContent = `第 ${run.idx + 1} 题`;
  document.getElementById("q-scene").textContent = q.scene || "";
  document.getElementById("q-scene").style.display = q.scene ? "" : "none";
  document.getElementById("q-text").textContent = q.q;
  // 选项
  const opts = document.getElementById("opts");
  opts.innerHTML = "";
  const keys = ["A", "B", "C"];
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "opt";
    btn.innerHTML = `<span class="opt-key">${keys[i]}</span><span>${opt}</span>`;
    btn.addEventListener("click", () => answer(i, btn));
    opts.appendChild(btn);
  });
  // 隐藏解释与下一题
  document.getElementById("explain").style.display = "none";
  const nextBtn = document.getElementById("btn-next");
  nextBtn.style.display = "none";
  nextBtn.textContent = run.idx === PER_LEVEL - 1 ? "看成绩 🏁" : "下一题 ▶";
}
function answer(i, btnEl) {
  if (run.answered) return;
  run.answered = true;
  const q = run.questions[run.idx];
  const opts = document.querySelectorAll(".opt");
  opts.forEach(o => o.classList.add("disabled"));
  const isCorrect = i === q.correct;

  if (isCorrect) {
    btnEl.classList.add("correct");
    run.score += BASE_SCORE * run.combo;
    run.combo = Math.min(run.combo + 1, MAX_COMBO);
    sfx.correct();
  } else {
    btnEl.classList.add("wrong");
    opts[q.correct].classList.add("correct");
    run.combo = 1;
    run.lives--;
    sfx.wrong();
    renderLives();
  }
  // 解释卡
  const exp = document.getElementById("explain");
  document.getElementById("explain-body").innerHTML = q.explain;
  exp.style.display = "block";
  document.getElementById("btn-next").style.display = "block";

  if (!isCorrect && run.lives <= 0) {
    setTimeout(() => { sfx.lose(); showFailOverlay(); }, 700);
  }
}
document.getElementById("btn-next").addEventListener("click", () => {
  sfx.click();
  if (run.idx < PER_LEVEL - 1) {
    run.idx++;
    renderQuestion();
  } else {
    finishLevel();
  }
});

/* ================= 失败弹层 ================= */
function showFailOverlay() {
  document.getElementById("overlay-fail").classList.add("show");
}
function hideFailOverlay() {
  document.getElementById("overlay-fail").classList.remove("show");
}
document.getElementById("btn-fail-retry").addEventListener("click", () => {
  sfx.click();
  hideFailOverlay();
  startLevel(run.level.id);
});

/* ================= 关卡结算 ================= */
function finishLevel() {
  const lv = run.level;
  const stars = run.lives; // 剩 3/2/1 颗心 = 3/2/1 星
  const prev = state.best[lv.id];
  const isNewBest = !prev || run.score > prev.score;
  const isNewStars = !prev || stars > prev.stars;

  // 更新存档（星星和分数各取最优）
  if (!prev || stars > prev.stars || (stars === prev.stars && run.score > prev.score)) {
    state.best[lv.id] = { stars, score: run.score };
  }
  if (!state.badges.includes(lv.id)) state.badges.push(lv.id);
  if (lv.id === state.unlocked && lv.id < LEVELS.length) state.unlocked = lv.id + 1;
  state.totalBest = Object.values(state.best).reduce((s, v) => s + v.score, 0);
  save();

  // 渲染
  document.getElementById("result-emoji").textContent = stars === 3 ? "🌟" : stars === 2 ? "😊" : "💪";
  const starsEl = document.getElementById("result-stars");
  starsEl.innerHTML = "";
  for (let i = 0; i < 3; i++) {
    const s = document.createElement("span");
    s.className = "star" + (i < stars ? " on" : " off");
    s.textContent = "★";
    s.style.animationDelay = (0.15 + i * 0.25) + "s";
    starsEl.appendChild(s);
  }
  document.getElementById("badge-award").textContent = lv.badge;
  document.getElementById("result-score").textContent = run.score;
  document.getElementById("result-record").textContent =
    isNewStars && isNewBest ? "🎉 新纪录！星级和分数都刷新啦" :
    isNewBest ? "🎉 分数刷新纪录啦" :
    isNewStars ? "⭐ 星级提升啦" : "";
  sfx.win();

  const nextBtn = document.getElementById("btn-next-level");
  if (lv.id < LEVELS.length) {
    nextBtn.style.display = "block";
    nextBtn.textContent = "下一关 ▶";
  } else {
    nextBtn.style.display = "block";
    nextBtn.textContent = "🎓 毕业啦";
  }
  showScreen("screen-result");
}
document.getElementById("btn-next-level").addEventListener("click", () => {
  sfx.click();
  if (run.level.id < LEVELS.length) {
    startLevel(run.level.id + 1);
  } else {
    renderFinal();
    showScreen("screen-final");
  }
});
document.getElementById("btn-retry-level").addEventListener("click", () => {
  sfx.click();
  startLevel(run.level.id);
});
document.getElementById("btn-to-map").addEventListener("click", () => {
  sfx.click();
  renderMap();
  showScreen("screen-map");
});

/* ================= 毕业页 ================= */
function rankOf(total) {
  if (total >= 4000) return "🏆 装机大神";
  if (total >= 3000) return "🥈 装机老手";
  if (total >= 2000) return "🥉 装机学徒";
  return "🌱 新手村村民";
}
function renderFinal() {
  document.getElementById("grad-score").textContent = state.totalBest;
  document.getElementById("grad-rank").textContent = rankOf(state.totalBest);
  const box = document.getElementById("grad-badges");
  box.innerHTML = "";
  LEVELS.forEach(lv => {
    const got = state.badges.includes(lv.id);
    const d = document.createElement("div");
    d.className = "grad-badge";
    d.innerHTML = `<span class="gb-emoji">${got ? lv.badge.split(" ")[0] : "🔒"}</span>${got ? lv.badge.split(" ")[1] : "未获得"}`;
    box.appendChild(d);
  });
}
document.getElementById("btn-replay-all").addEventListener("click", () => {
  sfx.click();
  state = { unlocked: 1, best: {}, badges: [], totalBest: 0 };
  save();
  renderMap();
  showScreen("screen-map");
});
document.getElementById("btn-final-map").addEventListener("click", () => {
  sfx.click();
  renderMap();
  showScreen("screen-map");
});
document.getElementById("btn-final-home").addEventListener("click", () => {
  sfx.click();
  showScreen("screen-start");
});
document.getElementById("btn-home").addEventListener("click", () => {
  sfx.click();
  showScreen("screen-start");
});

/* ================= 成绩单分享 ================= */
const CARD_FONT = '"PingFang SC","Microsoft YaHei","Apple Color Emoji","Segoe UI Emoji",sans-serif';
function roundRectPath(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
let toastTimer = null;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 4500);
}
function drawShareCard() {
  const W = 1080, H = 1440;
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const ctx = c.getContext('2d');
  const ink = '#2b2b2b', muted = '#7a7265', gold = '#f5b800';

  // 背景 + 卡通粗边框
  ctx.fillStyle = '#f6f1e7';
  ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = ink;
  ctx.lineWidth = 12;
  roundRectPath(ctx, 24, 24, W - 48, H - 48, 44);
  ctx.stroke();

  // 标题
  ctx.textAlign = 'center';
  ctx.fillStyle = ink;
  ctx.font = '900 84px ' + CARD_FONT;
  ctx.fillText('💻📱 装机小课堂', W / 2, 205);
  ctx.font = '600 42px ' + CARD_FONT;
  ctx.fillStyle = muted;
  ctx.fillText('我的装机成绩单', W / 2, 285);

  // 称号 + 得分卡
  const rankText = rankOf(state.totalBest);
  roundRectPath(ctx, 80, 360, 920, 420, 36);
  ctx.fillStyle = '#ffffff';
  ctx.fill();
  ctx.strokeStyle = ink;
  ctx.lineWidth = 8;
  ctx.stroke();

  // 称号胶囊
  ctx.font = '900 58px ' + CARD_FONT;
  const rw = ctx.measureText(rankText).width + 90;
  roundRectPath(ctx, (W - rw) / 2, 415, rw, 100, 50);
  ctx.fillStyle = '#ffd93d';
  ctx.fill();
  ctx.strokeStyle = ink;
  ctx.lineWidth = 6;
  ctx.stroke();
  ctx.fillStyle = ink;
  ctx.fillText(rankText, W / 2, 489);

  // 总得分
  ctx.font = '600 40px ' + CARD_FONT;
  ctx.fillStyle = muted;
  ctx.fillText('总 得 分', W / 2, 610);
  ctx.font = '900 100px ' + CARD_FONT;
  ctx.fillStyle = ink;
  ctx.fillText(String(state.totalBest), W / 2, 730);

  // 三关徽章行
  const rowY = [860, 1010, 1160];
  LEVELS.forEach((lv, i) => {
    const y = rowY[i];
    roundRectPath(ctx, 80, y, 920, 120, 28);
    ctx.fillStyle = '#ffffff';
    ctx.fill();
    ctx.strokeStyle = ink;
    ctx.lineWidth = 6;
    ctx.stroke();

    // 左侧色块 + emoji
    roundRectPath(ctx, 104, y + 16, 88, 88, 20);
    ctx.fillStyle = lv.soft;
    ctx.fill();
    ctx.strokeStyle = ink;
    ctx.lineWidth = 5;
    ctx.stroke();
    ctx.font = '52px ' + CARD_FONT;
    ctx.fillText(lv.emoji, 148, y + 80);

    // 关卡名 + 徽章名
    ctx.textAlign = 'left';
    ctx.font = '700 40px ' + CARD_FONT;
    ctx.fillStyle = ink;
    ctx.fillText('第 ' + lv.id + ' 关 · ' + lv.name, 224, y + 58);
    const got = state.badges.includes(lv.id);
    ctx.font = '600 34px ' + CARD_FONT;
    ctx.fillStyle = muted;
    ctx.fillText(got ? lv.badge : '未通关', 224, y + 102);

    // 星级（右对齐）
    const stars = state.best[lv.id] ? state.best[lv.id].stars : 0;
    ctx.font = '46px ' + CARD_FONT;
    ctx.textAlign = 'right';
    let sx = 962;
    for (let s = 0; s < 3; s++) {
      ctx.fillStyle = s < stars ? gold : '#d8d2c4';
      ctx.fillText('★', sx, y + 84);
      sx -= 58;
    }
    ctx.textAlign = 'center';
  });

  // 底部：日期
  const today = new Date().toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric' });
  ctx.font = '500 34px ' + CARD_FONT;
  ctx.fillStyle = muted;
  ctx.fillText(today, W / 2, H - 120);

  return c.toDataURL('image/png');
}
function saveShareImage() {
  const url = drawShareCard();
  const a = document.createElement('a');
  a.href = url;
  a.download = '装机小课堂-成绩单.png';
  document.body.appendChild(a);
  a.click();
  a.remove();
  showToast('📸 成绩单已生成！电脑上会自动下载；手机上请长按新打开的图片保存');
}
document.getElementById('btn-share').addEventListener('click', () => {
  sfx.click();
  saveShareImage();
});
