<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>yt-dlp 工具集｜基于 yt-dlp 的视频下载工具</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Ctext%20x%3D%225%22%20y%3D%221.5em%22%20font-size%3D%2245%22%3E%F0%9F%93%A5%3C%2Ftext%3E%3C%2Fsvg%3E">
<style>
  :root {
    --bg: #f6f1e7;
    --card: #ffffff;
    --ink: #2b2b2b;
    --muted: #7a7265;
    --border: #2b2b2b;
    --shadow: 5px 5px 0 rgba(43,43,43,.14);
    --green: #07c160;
    --green-soft: #e2f9ec;
    --blue: #4a7dff;
    --blue-soft: #e3ecff;
    --orange: #ff9f43;
    --orange-soft: #fff0dd;
    --red: #ff6b6b;
    --radius: 20px;
    --line: #d8d0bf;
    --line-dash: #ddd5c4;
    --desc: #4a463e;
    --star: #b8860b;
    --criteria-text: #3d5a4d;
    --footer: #666;
    --footer-border: #ddd;
  }
  [data-theme="dark"] {
    --bg: #191b20;
    --card: #252932;
    --ink: #e8e5de;
    --muted: #97917f;
    --border: #3c414d;
    --shadow: 5px 5px 0 rgba(0,0,0,.35);
    --green: #2ec97a;
    --green-soft: #16352a;
    --blue: #5b8cff;
    --blue-soft: #1c2a4a;
    --orange: #ffa94d;
    --orange-soft: #3d2f1c;
    --red: #ff6b6b;
    --line: #3c414d;
    --line-dash: #3c414d;
    --desc: #b5ae9f;
    --star: #e6b422;
    --criteria-text: #9fd8b5;
    --footer: #8b8577;
    --footer-border: #3c414d;
  }
  html { scroll-behavior: smooth; }
  body { transition: background .25s ease, color .25s ease; }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--ink);
    font-size: 16px;
    line-height: 1.6;
    padding: calc(14px + env(safe-area-inset-top, 0px)) 14px calc(24px + env(safe-area-inset-bottom, 0px));
  }
  #app { max-width: none; }

  /* ===== 头部 ===== */
  header { text-align: left; margin: 0 14px 18px 222px; }
  .header-title { display: flex; align-items: center; gap: 12px; }
  .logo-big { font-size: 36px; line-height: 1; }
  .title-main { font-size: 30px; font-weight: 800; letter-spacing: 1px; margin: 0; }
  .title-sub { color: var(--muted); font-size: 15px; margin-top: 6px; }
  .meta-row { display: flex; justify-content: flex-start; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
  .meta-chip {
    background: var(--card);
    border: 2.5px solid var(--border);
    border-radius: 999px;
    box-shadow: 3px 3px 0 rgba(43,43,43,.14);
    padding: 4px 14px;
    font-size: 13px;
    font-weight: 600;
  }
  .meta-chip.green { background: var(--green-soft); color: var(--criteria-text); }
  .criteria {
    margin: 14px 0 0;
    max-width: 620px;
    background: var(--green-soft);
    border: 2px solid var(--border);
    border-radius: 14px;
    padding: 8px 14px;
    font-size: 13px;
    color: var(--criteria-text);
  }

  /* ===== 布局：侧边栏 + 内容 ===== */
  .layout { display: block; }
  main.content { margin-left: 222px; margin-right: 14px; max-width: 960px; }

  /* ===== 分类导航（桌面：左侧栏）===== */
  nav.catnav {
    position: fixed;
    left: 14px;
    top: 200px;
    width: 168px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 6px 20px 12px 0;
    border-right: 1.5px dashed var(--line-dash);
    max-height: calc(100vh - 28px);
    overflow-y: auto;
    scrollbar-width: none;
  }
  nav.catnav::-webkit-scrollbar { display: none; }
  .catnav a {
    display: block;
    text-decoration: none;
    color: var(--ink);
    background: var(--card);
    border: 2.5px solid var(--border);
    border-radius: 12px;
    box-shadow: 3px 3px 0 rgba(43,43,43,.14);
    padding: 9px 12px;
    font-size: 14px;
    font-weight: 600;
    white-space: nowrap;
    transition: background .15s, color .15s;
  }
  .catnav a:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 rgba(43,43,43,.14); }
  .catnav a.active { background: var(--green); color: #fff; }
  .catnav a .catnav-icon { margin-right: 6px; }

  /* 移动端：分类导航变顶部换行 chips */
  @media (max-width: 899px) {
    header { margin-left: 14px; margin-right: 14px; }
    .layout { flex-direction: column; gap: 0; padding-left: 0; }
    main.content { margin-left: 0; margin-right: 0; max-width: none; }
    nav.catnav {
      position: static;
      width: auto;
      flex-direction: row;
      flex-wrap: wrap;
      gap: 8px;
      max-height: none;
      overflow: visible;
      padding: 6px 2px 12px;
      border-right: none;
      margin-bottom: 4px;
    }
    .catnav a { border-radius: 999px; padding: 6px 14px; }
  }

  /* ===== 分类区块 ===== */
  section.cat { margin-top: 22px; scroll-margin-top: 14px; }
  .cat-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .cat-icon { font-size: 26px; }
  .cat-name { font-size: 21px; font-weight: 800; letter-spacing: .5px; }
  .cat-hint { color: var(--muted); font-size: 13px; }
  .cat-count { margin-left: auto; font-size: 13px; font-weight: 700; color: var(--muted); background: var(--card); border: 2px solid var(--border); border-radius: 999px; padding: 2px 10px; box-shadow: 2px 2px 0 rgba(43,43,43,.12); }

  .grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
  @media (min-width: 720px) { .grid { grid-template-columns: 1fr 1fr; } }
  @media (min-width: 1100px) { .grid { grid-template-columns: repeat(3, 1fr); } }

  /* ===== 工具卡片 ===== */
  .tool {
    background: var(--card);
    border: 3px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 16px 16px 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    animation: pop .3s ease;
  }
  @keyframes pop { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .tool-top { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; margin-bottom: 2px; }
  .tool-name { display: inline-block; font-size: 17px; font-weight: 800; color: var(--ink); text-decoration: none; border-bottom: 2px solid transparent; }
  .tool-name:hover { border-bottom-color: var(--green); }
  .tool-name::after { content: " ↗"; font-size: 13px; color: var(--green); }
  .tool-repo {
    display: inline-block;
    font-size: 12px;
    color: var(--muted);
    background: var(--bg);
    border: 1.5px solid var(--line);
    border-radius: 8px;
    padding: 1px 8px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    word-break: break-all;
  }
  .tool-desc { font-size: 14px; color: var(--desc); }
  .tool-meta {
    margin-top: auto;
    display: flex;
    flex-wrap: wrap;
    gap: 4px 14px;
    font-size: 12.5px;
    color: var(--muted);
    border-top: 1.5px dashed var(--line-dash);
    padding-top: 8px;
  }
  .tool-meta b { color: var(--ink); }
  .star { color: var(--star); font-weight: 700; }

  /* ===== 加载/错误 ===== */
  .status-box {
    text-align: center;
    padding: 40px 20px;
    color: var(--muted);
    font-size: 15px;
  }
  .status-box.error { color: var(--red); }

  /* ===== 浮动按钮：返回顶部 / 深色模式 ===== */
  .floating-btn {
    position: fixed;
    z-index: 60;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 2.5px solid var(--border);
    background: var(--card);
    color: var(--ink);
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    box-shadow: 3px 3px 0 rgba(0,0,0,.18);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform .08s, box-shadow .08s, opacity .25s, background .25s;
    font-family: inherit;
  }
  .floating-btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 rgba(0,0,0,.18); }
  .theme-btn { top: calc(14px + env(safe-area-inset-top, 0px)); right: 14px; }
  .top-btn {
    bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    right: 14px;
    opacity: 0;
    pointer-events: none;
  }
  .top-btn.show { opacity: 1; pointer-events: auto; }

  /* ===== 页脚 ===== */
  footer { margin-top: 50px; padding: 20px; border-top: 1px solid var(--footer-border); text-align: center; font-size: 14px; color: var(--footer); }
  footer a { color: var(--green); text-decoration: none; margin: 0 10px; }
  footer a:hover { text-decoration: underline; }
  .footer-links { margin-bottom: 10px; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="header-title">
      <div class="logo-big">📥</div>
      <h1 class="title-main">yt-dlp 工具集</h1>
    </div>
    <p class="title-sub" id="subtitle">基于 yt-dlp 的视频下载工具清单</p>
    <div class="meta-row">
      <span class="meta-chip green" id="chip-updated">数据更新于 —</span>
      <span class="meta-chip" id="chip-total">共 — 个工具</span>
    </div>
    <p class="criteria" id="criteria">收录标准：以 yt-dlp 为下载后端、仍在活跃维护、star ≥ 50 或功能独特</p>
  </header>
</div>

<div class="layout">
  <nav class="catnav" id="catnav"></nav>
  <main class="content" id="content">
    <div class="status-box">⏳ 正在加载工具清单…</div>
  </main>
</div>

<button id="theme-btn" class="floating-btn theme-btn" type="button" aria-label="切换浅色/深色模式" title="浅色 / 深色">🌙</button>
<button id="top-btn" class="floating-btn top-btn" type="button" aria-label="返回顶部" title="返回顶部">↑</button>

<script>
(function () {
  // ===== 深色 / 浅色主题切换 =====
  const THEME_KEY = 'ytdlp-theme';
  const themeBtn = document.getElementById('theme-btn');
  function applyTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    if (themeBtn) themeBtn.textContent = t === 'dark' ? '☀️' : '🌙';
    try { localStorage.setItem(THEME_KEY, t); } catch (e) {}
  }
  let savedTheme = null;
  try { savedTheme = localStorage.getItem(THEME_KEY); } catch (e) {}
  applyTheme(savedTheme === 'dark' ? 'dark' : 'light');
  if (themeBtn) themeBtn.addEventListener('click', () => {
    const cur = document.documentElement.getAttribute('data-theme');
    applyTheme(cur === 'dark' ? 'light' : 'dark');
  });

  // ===== 返回顶部 =====
  const topBtn = document.getElementById('top-btn');
  window.addEventListener('scroll', () => {
    if (topBtn) topBtn.classList.toggle('show', (window.scrollY || 0) > 400);
  }, { passive: true });
  if (topBtn) topBtn.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

  // ===== 侧边栏定位（桌面端：贴左 + 与首个分类标题对齐）=====
  function positionNav() {
    const nav = document.getElementById('catnav');
    const hd = document.querySelector('header');
    if (window.innerWidth >= 900 && hd && nav) {
      nav.style.top = (hd.offsetHeight + 4) + 'px';
    }
  }
  window.addEventListener('resize', positionNav);
  window.addEventListener('load', positionNav);
  positionNav();

  function fmtStars(n) {
    if (n == null) return '—';
    if (n >= 10000) return (n / 10000).toFixed(1).replace(/\.0$/, '') + ' 万';
    if (n >= 1000) return (n / 1000).toFixed(1).replace(/\.0$/, '') + 'k';
    return String(n);
  }

  function fmtDate(s) {
    if (!s) return '—';
    const d = new Date(s.length === 10 ? s + 'T00:00:00Z' : s);
    if (isNaN(d)) return s;
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  }

  function render(data) {
    const m = data.meta || {};
    document.title = (m.title || 'yt-dlp 工具集') + '｜基于 yt-dlp 的视频下载工具';
    if (m.subtitle) document.getElementById('subtitle').textContent = m.subtitle;
    document.getElementById('chip-updated').textContent = '数据更新于 ' + fmtDate(m.updatedAt);
    const cats = data.categories || [];
    const total = cats.reduce((s, c) => s + (c.tools ? c.tools.length : 0), 0);
    document.getElementById('chip-total').textContent = '共 ' + total + ' 个工具';
    if (m.criteria) document.getElementById('criteria').textContent = m.criteria;

    // 左侧分类导航（用短名 shortName）
    const nav = document.getElementById('catnav');
    nav.innerHTML = cats.map((c, i) =>
      `<a href="#cat-${c.id}"><span class="catnav-icon">${c.icon || ''}</span>${c.shortName || c.name}</a>`
    ).join('');

    // 分类区块
    const content = document.getElementById('content');
    content.innerHTML = cats.map((c, i) => `
      <section class="cat" id="cat-${c.id}" data-cat="${c.id}">
        <div class="cat-head">
          <span class="cat-icon">${c.icon || '📦'}</span>
          <span class="cat-name">${c.name}</span>
          <span class="cat-hint">${c.hint || ''}</span>
          <span class="cat-count">${c.tools.length} 个</span>
        </div>
        <div class="grid">
          ${c.tools.map(toolCard).join('')}
        </div>
      </section>
    `).join('');

    initNav();
  }

  // ===== 锚点跳转 + 当前分类高亮 =====
  function initNav() {
    const nav = document.getElementById('catnav');
    const links = Array.from(nav.querySelectorAll('a'));
    // 点击跳转
    nav.addEventListener('click', e => {
      const a = e.target.closest('a');
      if (!a) return;
      e.preventDefault();
      const target = document.getElementById(a.getAttribute('href').slice(1));
      if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
      links.forEach(l => l.classList.toggle('active', l === a));
    });
    // 滚动时高亮当前分类
    const sections = Array.from(document.querySelectorAll('section.cat'));
    if (!('IntersectionObserver' in window)) return;
    const io = new IntersectionObserver(entries => {
      entries.forEach(en => {
        if (!en.isIntersecting) return;
        const id = en.target.id;
        links.forEach(l => l.classList.toggle('active', l.getAttribute('href') === '#' + id));
      });
    }, { rootMargin: '-15% 0px -75% 0px' });
    sections.forEach(s => io.observe(s));
  }

  function toolCard(t) {
    return `
      <article class="tool">
        <div class="tool-top">
          <a class="tool-name" href="https://github.com/${t.repo}" target="_blank" rel="noopener">${t.name}</a>
          <span class="tool-repo">${t.repo}</span>
        </div>
        <p class="tool-desc">${t.desc || ''}</p>
        <div class="tool-meta">
          <span>⭐ <b class="star">${fmtStars(t.stars)}</b></span>
          <span>🕐 <b>${fmtDate(t.lastPush)}</b></span>
        </div>
      </article>
    `;
  }

  // 数据加载失败时的兜底
  function showError(msg) {
    document.getElementById('content').innerHTML =
      `<div class="status-box error">${msg}</div>`;
  }

  fetch('yt-dlp-tools.json', { cache: 'no-store' })
    .then(r => {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(render)
    .catch(err => {
      showError('⚠️ 工具清单加载失败：' + err.message +
        '<br>请确认 yt-dlp-tools.json 与本页面在同一目录（部署于 GitHub Pages 时正常）。');
    });
})();
</script>
<script src="footer.js"></script>
</body>
</html>
